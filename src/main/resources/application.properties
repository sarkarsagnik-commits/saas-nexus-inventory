# ============================================
# SaaS Nexus Inventory - Application Properties
# ============================================

spring.application.name=saas-nexus-inventory

# --- Virtual Threads (Project Loom) ---
spring.threads.virtual.enabled=true

# --- Data Source (PostgreSQL via Docker Compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=app_user
spring.datasource.password=inventory_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.saasnexus.inventory.tenant.TenantConnectionInterceptor

# --- Spring Security ---
# Disable default security auto-config for development
# (remove or configure properly for production)
spring.security.user.name=admin
spring.security.user.password=changeme

# --- Docker Compose ---
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.file=docker-compose.yml

# --- Spring AI / OpenAI ---
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.options.model=gpt-4o

# --- Server ---
server.port=8080
