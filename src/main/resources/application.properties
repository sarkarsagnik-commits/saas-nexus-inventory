# ============================================
# SaaS Nexus Inventory - Application Properties
# ============================================

spring.application.name=saas-nexus-inventory

# --- Virtual Threads (Project Loom) ---
spring.threads.virtual.enabled=true

# --- Data Source (PostgreSQL via Docker Compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=app_user
spring.datasource.password=inventory_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool ---
# CRITICAL: auto-commit=false ensures connections are already in a
# transaction block when checked out. This is required for
# set_config('app.current_tenant', ?, true) [transaction-local]
# to work correctly. Without this, the setting is silently discarded.
spring.datasource.hikari.auto-commit=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.saasnexus.inventory.tenant.TenantConnectionInterceptor

# --- Spring Security ---
# Phase 1: All auth is disabled (SecurityConfig permits all).
# Phase 2: Configure OAuth2 Resource Server with JWT.

# --- Docker Compose ---
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.file=docker-compose.yml

# --- Spring AI / OpenAI ---
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.chat.options.model=gpt-4o

# --- Server ---
server.port=8080
